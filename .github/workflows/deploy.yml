name: Deploy FearLab website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fearlab-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REMOTE_ARCHIVE_PATH: /home/ubuntu/fearlab-site-src.tar.gz
      SOURCE_DIR: /home/ubuntu/fearlab-site-src
      SITE_ROOT: /var/www/fearlab/current
      RELEASE_ROOT: /var/www/fearlab/releases
      BACKUP_ROOT: /home/ubuntu/fearlab-backups
      NGINX_SITE: /etc/nginx/sites-available/fearlab.conf
      DOMAIN: fearlab.space
      WWW_DOMAIN: www.fearlab.space

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Create deploy archive
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/fearlab-site-src.tar.gz"
          COPYFILE_DISABLE=1 tar \
            --exclude=".git" \
            --exclude="node_modules" \
            --exclude="dist" \
            --exclude=".deploy" \
            --exclude=".playwright-cli" \
            --exclude="output" \
            --exclude="skills.md" \
            --exclude="deploy" \
            --exclude="scripts-local" \
            -czf "$ARCHIVE_PATH" \
            .
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Prepare remote deploy script
        run: |
          REMOTE_SCRIPT_PATH="$RUNNER_TEMP/fearlab-remote-build.sh"
          cat > "$REMOTE_SCRIPT_PATH" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          SSL_CERT_PATH=""
          SSL_KEY_PATH=""
          DEFAULT_SSL_CERT_PATH="/etc/ssl/fearlab/origin.crt"
          DEFAULT_SSL_KEY_PATH="/etc/ssl/fearlab/origin.key"

          if [[ -f "$DEFAULT_SSL_CERT_PATH" ]]; then
            SSL_CERT_PATH="$DEFAULT_SSL_CERT_PATH"
          fi

          if [[ -f "$DEFAULT_SSL_KEY_PATH" ]]; then
            SSL_KEY_PATH="$DEFAULT_SSL_KEY_PATH"
          fi

          require_command() {
            command -v "$1" >/dev/null 2>&1
          }

          node_supports_vite8() {
            require_command node && node -e '
              const [major, minor] = process.versions.node.split(".").map(Number)
              const supported =
                (major === 20 && minor >= 19) ||
                (major === 22 && minor >= 12) ||
                major > 22
              process.exit(supported ? 0 : 1)
            '
          }

          if ! sudo -n true >/dev/null 2>&1; then
            echo "Passwordless sudo is required for remote deployment." >&2
            exit 1
          fi

          if ! node_supports_vite8; then
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl gnupg
            sudo mkdir -p /etc/apt/keyrings
            sudo rm -f /etc/apt/keyrings/nodesource.gpg
            curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
              | sudo gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
            echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" \
              | sudo tee /etc/apt/sources.list.d/nodesource.list >/dev/null
            sudo apt-get update
            sudo apt-get install -y nodejs
          fi

          if ! require_command nginx; then
            sudo apt-get update
            sudo apt-get install -y nginx
          fi

          BACKUP_DIR="${BACKUP_ROOT}/$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$BACKUP_DIR"
          if [[ -d "$SOURCE_DIR" ]]; then
            tar \
              --exclude="node_modules" \
              --exclude="dist" \
              -czf "$BACKUP_DIR/source.tar.gz" \
              -C "$SOURCE_DIR" \
              .
          fi
          if sudo test -d "$SITE_ROOT"; then
            sudo tar -czf "$BACKUP_DIR/site.tar.gz" -C "$SITE_ROOT" .
            sudo chown "$(id -u):$(id -g)" "$BACKUP_DIR/site.tar.gz"
          fi
          find "$BACKUP_ROOT" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf '%f\n' \
            | sort -r \
            | tail -n +11 \
            | while IFS= read -r backup_name; do
                rm -rf -- "$BACKUP_ROOT/$backup_name"
              done

          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"
          tar -xzf "$ARCHIVE_PATH" -C "$SOURCE_DIR"

          cd "$SOURCE_DIR"
          echo "Building with Node $(node -v) and npm $(npm -v)"
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi
          npm run check
          npm run build

          RELEASE_ID="$(date -u +%Y%m%dT%H%M%SZ)"
          RELEASE_DIR="$RELEASE_ROOT/$RELEASE_ID"
          NEXT_LINK="${SITE_ROOT}.next"
          sudo mkdir -p "$RELEASE_DIR"
          sudo cp -a "$SOURCE_DIR/dist/." "$RELEASE_DIR/"
          sudo chown -R www-data:www-data "$RELEASE_DIR"

          if [[ -n "$SSL_CERT_PATH" && -n "$SSL_KEY_PATH" ]]; then
            HTTP_BEHAVIOR="    return 301 https://${DOMAIN}\$request_uri;"
            SSL_BLOCK=$(cat <<EOF
          server {
              listen 443 ssl http2;
              listen [::]:443 ssl http2;
              server_name ${DOMAIN} ${WWW_DOMAIN};

              ssl_certificate ${SSL_CERT_PATH};
              ssl_certificate_key ${SSL_KEY_PATH};
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_ciphers HIGH:!aNULL:!MD5;

              if (\$host = ${WWW_DOMAIN}) {
                  return 301 https://${DOMAIN}\$request_uri;
              }

              root ${SITE_ROOT};
              index index.html;

              location / {
                  try_files \$uri \$uri/ /index.html;
              }
          }
          EOF
            )
          else
            HTTP_BEHAVIOR=$(cat <<EOF
              if (\$host = ${WWW_DOMAIN}) {
                  return 301 http://${DOMAIN}\$request_uri;
              }

              root ${SITE_ROOT};
              index index.html;

              location / {
                  try_files \$uri \$uri/ /index.html;
              }
          EOF
            )
            SSL_BLOCK=""
          fi

          sudo tee "$NGINX_SITE" >/dev/null <<EOF
          server {
              listen 3001 default_server;
              listen [::]:3001 default_server;
              server_name _;

              root ${SITE_ROOT};
              index index.html;

              location / {
                  try_files \$uri \$uri/ /index.html;
              }
          }

          server {
              listen 80;
              listen [::]:80;
              server_name ${DOMAIN} ${WWW_DOMAIN};

          ${HTTP_BEHAVIOR}
          }

          ${SSL_BLOCK}
          EOF

          sudo ln -sfn "$NGINX_SITE" /etc/nginx/sites-enabled/fearlab.conf
          if [[ -f /etc/nginx/sites-enabled/default ]]; then
            sudo rm -f /etc/nginx/sites-enabled/default
          fi

          sudo nginx -t

          sudo ln -sfn "$RELEASE_DIR" "$NEXT_LINK"
          if sudo test -L "$SITE_ROOT"; then
            sudo mv -Tf "$NEXT_LINK" "$SITE_ROOT"
          elif sudo test -e "$SITE_ROOT"; then
            LEGACY_DIR="$RELEASE_ROOT/${RELEASE_ID}-legacy"
            sudo mv "$SITE_ROOT" "$LEGACY_DIR"
            if ! sudo mv -Tf "$NEXT_LINK" "$SITE_ROOT"; then
              sudo mv "$LEGACY_DIR" "$SITE_ROOT"
              exit 1
            fi
          else
            sudo mv -Tf "$NEXT_LINK" "$SITE_ROOT"
          fi

          sudo systemctl enable nginx
          if sudo systemctl is-active --quiet nginx; then
            sudo systemctl reload nginx
          else
            sudo systemctl start nginx
          fi

          CURRENT_RELEASE="$(sudo readlink -f "$SITE_ROOT")"
          sudo find "$RELEASE_ROOT" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf '%T@ %p\n' \
            | sort -nr \
            | tail -n +6 \
            | cut -d' ' -f2- \
            | while IFS= read -r old_release; do
                if [[ "$old_release" != "$CURRENT_RELEASE" ]]; then
                  sudo rm -rf -- "$old_release"
                fi
              done
          SCRIPT
          chmod +x "$REMOTE_SCRIPT_PATH"
          echo "REMOTE_SCRIPT_PATH=$REMOTE_SCRIPT_PATH" >> "$GITHUB_ENV"

      - name: Set up SSH credentials
        env:
          FEARLAB_HOST: ${{ secrets.FEARLAB_HOST }}
          FEARLAB_PORT: ${{ secrets.FEARLAB_PORT }}
          FEARLAB_SSH_KEY: ${{ secrets.FEARLAB_SSH_KEY }}
          FEARLAB_USER: ${{ secrets.FEARLAB_USER }}
        run: |
          if [ -z "$FEARLAB_HOST" ] || [ -z "$FEARLAB_USER" ] || [ -z "$FEARLAB_SSH_KEY" ]; then
            echo "Missing FEARLAB_HOST, FEARLAB_USER, or FEARLAB_SSH_KEY secret." >&2
            exit 1
          fi

          PORT="${FEARLAB_PORT:-22}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          printf '%s\n' "$FEARLAB_SSH_KEY" > ~/.ssh/fearlab_deploy
          chmod 600 ~/.ssh/fearlab_deploy
          ssh-keyscan -p "$PORT" -H "$FEARLAB_HOST" >> ~/.ssh/known_hosts

      - name: Upload deploy files
        env:
          REMOTE_HOST: ${{ secrets.FEARLAB_HOST }}
          REMOTE_USER: ${{ secrets.FEARLAB_USER }}
          REMOTE_PORT: ${{ secrets.FEARLAB_PORT }}
          SSH_KEY_PATH: /home/runner/.ssh/fearlab_deploy
          REMOTE_SCRIPT_TARGET: /home/ubuntu/fearlab-remote-build.sh
        run: |
          PORT="${REMOTE_PORT:-22}"
          TARGET="${REMOTE_USER}@${REMOTE_HOST}"

          scp -i "$SSH_KEY_PATH" -o IdentitiesOnly=yes -P "$PORT" "$ARCHIVE_PATH" "${TARGET}:${REMOTE_ARCHIVE_PATH}"
          scp -i "$SSH_KEY_PATH" -o IdentitiesOnly=yes -P "$PORT" "$REMOTE_SCRIPT_PATH" "${TARGET}:${REMOTE_SCRIPT_TARGET}"

      - name: Deploy to server
        env:
          REMOTE_HOST: ${{ secrets.FEARLAB_HOST }}
          REMOTE_USER: ${{ secrets.FEARLAB_USER }}
          REMOTE_PORT: ${{ secrets.FEARLAB_PORT }}
          SSH_KEY_PATH: /home/runner/.ssh/fearlab_deploy
          REMOTE_SCRIPT_TARGET: /home/ubuntu/fearlab-remote-build.sh
        run: |
          PORT="${REMOTE_PORT:-22}"
          TARGET="${REMOTE_USER}@${REMOTE_HOST}"
          ssh -i "$SSH_KEY_PATH" -o IdentitiesOnly=yes -p "$PORT" "$TARGET" \
            "chmod +x '${REMOTE_SCRIPT_TARGET}' && \
            ARCHIVE_PATH='${REMOTE_ARCHIVE_PATH}' \
            SOURCE_DIR='${SOURCE_DIR}' \
            SITE_ROOT='${SITE_ROOT}' \
            RELEASE_ROOT='${RELEASE_ROOT}' \
            BACKUP_ROOT='${BACKUP_ROOT}' \
            NGINX_SITE='${NGINX_SITE}' \
            DOMAIN='${DOMAIN}' \
            WWW_DOMAIN='${WWW_DOMAIN}' \
            '${REMOTE_SCRIPT_TARGET}'"
