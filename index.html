<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="FEAR Lab explores AI, human-computer interaction, and extended reality at The Hong Kong University of Science and Technology (Guangzhou). Meet our people and explore our research."
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>FEAR Lab | HKUST(GZ)</title>
    <script>
      // Start approved-member discovery before the application bundle is ready.
      // Keep this request shared with React, including development StrictMode.
      if (/^\/people\/?$/.test(window.location.pathname)) {
        window.__fearlabPeopleRequest = fetch('/api/public/people', { credentials: 'omit' })
          .then(function (response) { return response.ok ? response.json() : null })
          .then(function (data) {
            if (data && Array.isArray(data.people)) data.people.forEach(function (person) {
              var source = person.idPhotoUrl || person.idPhoto;
              if (typeof source === 'string') {
                var portrait = new Image();
                portrait.referrerPolicy = 'no-referrer';
                portrait.src = source;
              }
            });
            return data;
          })
          .catch(function () { return null });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
